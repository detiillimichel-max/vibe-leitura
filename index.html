<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#050505">
<title>Vibe Leitura - OIO ONE</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/lucide-static@0.468.0/font/Lucide.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="tela-identidade" onclick="abrirMapa()">
  <div class="foto-identidade"></div><h2>MICHEL</h2>
  <p class="subtitulo">Vibe Leitura</p><p class="toque">Toque para carregar as 20 rotas</p>
</div>
<div id="status-offline" class="status-online">● ONLINE</div>
<button id="btn-menu-rotas" class="btn-menu-rotas" onclick="abrirMenuRotas()" aria-label="Abrir rotas"><i data-lucide="menu"></i></button>
<div id="menu-rotas" class="menu-rotas"><div class="menu-cabecalho"><div><small>VIBE LEITURA</small><h2>20 ROTAS</h2></div><button onclick="fecharMenuRotas()" aria-label="Fechar"><i data-lucide="x"></i></button></div><div id="lista-rotas-menu"></div></div>
<div id="menu-overlay" onclick="fecharMenuRotas()"></div><div id="map"></div>
<section id="gaveta" class="gaveta">
  <div class="puxador"></div>
  <div class="gaveta-topo">
    <div><span id="rota-badge">ROTA</span><h2 id="rua-nome">Selecione uma rota</h2><p id="rota-contador">Selecione uma rua abaixo.</p></div>
    <button class="btn-fechar" onclick="fecharGaveta()">✕</button>
  </div>
  <input id="busca-rua" type="search" placeholder="🔎 Procurar rua nesta rota" oninput="filtrarRuas(this.value)">
  <div id="lista-ruas"></div>
  <div id="painel-rua" class="painel-rua oculto">
    <div class="painel-cabecalho">
      <div><small>ENDEREÇO SELECIONADO</small><h3 id="painel-rua-nome"></h3></div>
      <button class="btn-navegar" onclick="navegarParaRua()">📍 Navegar</button>
    </div>
    <label>Leitura atual</label><input type="number" id="leitura" inputmode="decimal" placeholder="Digite a leitura">
    <label>Observação / mensagem <span class="contador"><span id="contador-obs">0</span>/100</span></label><textarea id="obs" rows="3" maxlength="100" placeholder="Máximo 100 caracteres" oninput="atualizarContador()"></textarea>
    <button class="btn-camera" onclick="document.getElementById('cam').click()">📸 Tirar foto do hidrômetro</button>
    <input type="file" id="cam" accept="image/*" capture="environment" hidden onchange="selecionarFoto(event)">
    <div id="foto-status"></div><div id="contador-fotos"></div><div id="galeria-fotos"></div><button class="btn-camera" onclick="iniciarVideo()">🎥 Gravar vídeo (máx. 30 s)</button><div id="video-status"></div><div id="galeria-videos"></div><button class="btn-compartilhar" onclick="compartilharRegistro()">📤 Compartilhar foto/vídeo + anotação</button>
    <button class="btn-salvar" onclick="salvar()">💾 SALVAR LEITURA</button>
    <div id="status-salvo"></div>
  </div>
</section>
<div id="visualizador-midia" class="visualizador-midia oculto"><button class="viewer-fechar" onclick="fecharVisualizador()">✕</button><div id="viewer-conteudo"></div><div id="viewer-acoes"><button onclick="compartilharMidiaAtual()">📤 Compartilhar</button></div></div>
<div id="gravador-video" class="gravador-video oculto"><div class="gravador-topo"><b>🎥 Gravar vídeo</b><span id="tempo-video">00:00 / 00:30</span></div><video id="preview-video" autoplay muted playsinline></video><div class="gravador-acoes"><button onclick="pararVideo()">⏹️ Parar e salvar</button><button onclick="cancelarVideo()">✕ Cancelar</button></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<script src="js/rotas-data.js"></script><script src="js/db.js"></script><script src="js/mapa.js"></script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js").catch(()=>{}));}</script>
</body></html>
